name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to publish to Homebrew
        required: true
        type: string
      dry_run:
        description: Render the Formula without updating the tap
        required: true
        default: true
        type: boolean

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make ci
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: release
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dayflower/brew-up@a05113ea737699ae9f7079a1683e222413f4644e # v1.2.2
        id: brew_up
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          release-tag: ${{ inputs.release_tag || github.ref_name }}
          template-path: .github/homebrew/echoview.rb.mustache
          output-path: Formula/echoview.rb
          asset-map: |
            darwin_arm64=echoview_{{version}}_darwin_arm64.tar.gz
          checksum-asset: checksums.txt
          target-repo: dayflower/homebrew-tap
          target-branch: main
          target-repo-token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          publish-mode: pr
          only-if-changed: true
          dry-run: ${{ inputs.dry_run || false }}
          publish-title-template: 'chore: update echoview formula for {{tag_name}}'
          publish-body-template: 'Co-authored-by: codex <codex@openai.com>'
          publish-attribution: pr
      - name: Wait for tap Ruby syntax check
        if: ${{ steps.brew_up.outputs['pull-request-url'] != '' }}
        env:
          TAP_COMMIT_SHA: ${{ steps.brew_up.outputs['target-commit-sha'] }}
        run: |
          set -euo pipefail
          : "${TAP_COMMIT_SHA:?brew-up did not return a tap commit SHA}"

          for attempt in {1..40}; do
            checks="$(curl --fail --silent --show-error --retry 3 \
              --header 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/dayflower/homebrew-tap/commits/${TAP_COMMIT_SHA}/check-runs?per_page=100")"
            result="$(jq -r '
              [.check_runs[] | select(.name == "ruby-syntax-check")]
              | sort_by(.started_at) | last
              | if . == null or .status != "completed" then "pending" else .conclusion end
            ' <<< "$checks")"

            if [[ "$result" == success ]]; then
              exit 0
            fi
            if [[ "$result" != pending ]]; then
              echo "tap Ruby syntax check finished with ${result}" >&2
              exit 1
            fi
            sleep 15
          done

          echo 'timed out waiting for the tap Ruby syntax check' >&2
          exit 1
      - name: Merge tap pull request
        if: ${{ steps.brew_up.outputs['pull-request-url'] != '' }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          PR_URL: ${{ steps.brew_up.outputs['pull-request-url'] }}
        run: gh pr merge "$PR_URL" --squash --delete-branch
