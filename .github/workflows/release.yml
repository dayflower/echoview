name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to publish to Homebrew
        required: true
        type: string
      dry_run:
        description: Render the Formula without updating the tap
        required: true
        default: true
        type: boolean

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make ci
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    needs: release
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dayflower/brew-up@a05113ea737699ae9f7079a1683e222413f4644e # v1.2.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          release-tag: ${{ inputs.release_tag || github.ref_name }}
          template-path: .github/homebrew/echoview.rb.mustache
          output-path: Formula/echoview.rb
          asset-map: |
            darwin_arm64=echoview_{{version}}_darwin_arm64.tar.gz
          checksum-asset: checksums.txt
          target-repo: dayflower/homebrew-tap
          target-branch: main
          target-repo-token: ${{ secrets.HOMEBREW_GITHUB_API_TOKEN }}
          publish-mode: pr-auto-merge
          only-if-changed: true
          dry-run: ${{ inputs.dry_run || false }}
          publish-title-template: 'chore: update echoview formula for {{tag_name}}'
          publish-body-template: 'Co-authored-by: codex <codex@openai.com>'
          publish-attribution: pr
