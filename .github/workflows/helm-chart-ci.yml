name: Helm chart CI

on:
  push:
    branches:
      - main
    paths:
      - charts/echoview-prometheus/**
      - .github/workflows/helm-chart-ci.yml
  pull_request:
    paths:
      - charts/echoview-prometheus/**
      - .github/workflows/helm-chart-ci.yml

permissions:
  contents: read

jobs:
  helm-chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.0
      - run: helm lint --strict charts/echoview-prometheus
      - run: helm template echoview-prometheus charts/echoview-prometheus > /dev/null
      - run: helm template echoview-prometheus charts/echoview-prometheus --set serviceMonitor.enabled=true --set catalog.existingConfigMap=echoview-catalog > /dev/null
      - run: |
          helm template echoview-prometheus charts/echoview-prometheus --set-string instancesConfig.existingConfigMap= --set-string "instancesConfig.content=instances_format: 2" > /dev/null
      - run: helm package charts/echoview-prometheus --destination "$RUNNER_TEMP"
