  '0x05FF':
    properties:
      '0xC5':
        name:
          en: Name
          ja: 名称
        codec:
          kinds:
          - kind: text
            encoding: utf-8
            min_bytes: 1
            max_bytes: 64
            bom: false
        x-source:
          appendix:
            document: Appendix_Release_R_r4.pdf
            pages:
            - 640
            summary: UTF-8 name without a BOM, up to 64 bytes.
      '0xC8':
        name:
          en: Product code of the device to be controlled
          ja: 管理対象機器商品コード
        codec:
          kinds:
          - kind: text
            min_bytes: 1
            max_bytes: 12
        x-source:
          appendix:
            document: Appendix_Release_R_r4.pdf
            pages:
            - 640
            summary: ASCII identifier with a maximum length of 12 bytes.
      '0xE0':
        name:
          en: Address of installation location
          ja: 設置住所
        codec:
          kinds:
          - kind: text
            encoding: utf-8
            min_bytes: 1
            max_bytes: 255
            bom: false
        x-source:
          appendix:
            document: Appendix_Release_R_r4.pdf
            pages:
            - 641
            summary: UTF-8 address without a BOM, up to 255 bytes.
  '0x0602':
    properties:
      '0xB3':
        name:
          en: Character string to present to the user
          ja: 伝達文字列設定
        codec:
          kinds:
          - kind: encoded_text
            length_byte: 0
            encoding_byte: 1
            reserved_byte: 2
            text_offset: 3
            max_text_bytes: 244
            encodings:
              '0x01': us-ascii
              '0x02': shift_jis
              '0x03': iso-2022-jp
              '0x04': euc_jp
              '0x05': ucs-4
              '0x06': ucs-2
              '0x07': latin-1
              '0x08': utf-8
        x-source:
          appendix:
            document: Appendix_Release_R_r4.pdf
            pages:
            - 699
            - 700
            - 702
            summary: Length- and encoding-prefixed character data with eight defined
              encodings.
