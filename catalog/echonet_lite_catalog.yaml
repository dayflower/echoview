catalog_format: 1
source:
  mra:
    data_version: 1.3.2
    release: R
classes:
  '0x0000':
    kind: superclass
    name:
      en: Super class
      ja: スーパークラス
    short_name: common
    properties:
      '0x80':
        name:
          en: Operation status
          ja: 動作状態
        short_name: operationStatus
        access:
          get: required
          set: optional
          inf: required
        codec:
          kinds:
          - kind: enum
            size: 1
            values:
              '0x30':
                value: 'true'
                label:
                  en: 'ON'
                  ja: 'ON'
              '0x31':
                value: 'false'
                label:
                  en: 'OFF'
                  ja: 'OFF'
        prometheus:
          export: enum_map
          enum_map:
            values:
              '0x30': 1
              '0x31': 0
      '0x81':
        name:
          en: Installation location
          ja: 設置場所
        short_name: installationLocation
        access:
          get: required
          set: required
          inf: required
        codec:
          kinds:
          - kind: raw
      '0x82':
        name:
          en: Standard version information
          ja: 規格Version情報
        short_name: protocol
        access:
          get: required
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: raw
      '0x83':
        name:
          en: Identification number
          ja: 識別番号
        short_name: id
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: raw
      '0x84':
        name:
          en: Measured instantaneous power consumption
          ja: 瞬時消費電力計測値
        short_name: instantaneousElectricPowerConsumption
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: uint
            bytes: 2
            unit: W
            minimum: '0'
            maximum: '65533'
      '0x85':
        name:
          en: Measured cumulative electric energy consumption
          ja: 積算消費電力量計測値
        short_name: consumedCumulativeElectricEnergy
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: uint
            bytes: 4
            scale: '0.001'
            unit: kWh
            minimum: '0'
            maximum: '999999999'
        prometheus:
          metric_type: counter
      '0x86':
        name:
          en: Manufacturer's fault code
          ja: メーカ異常コード
        short_name: manufacturerFaultCode
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: raw
      '0x87':
        name:
          en: Current limit setting
          ja: 電流制限設定
        short_name: currentLimit
        access:
          get: optional
          set: optional
          inf: optional
        codec:
          kinds:
          - kind: uint
            bytes: 1
            unit: '%'
            minimum: '0'
            maximum: '100'
      '0x88':
        name:
          en: Fault status
          ja: 異常発生状態
        short_name: faultStatus
        access:
          get: required
          set: notApplicable
          inf: required
        codec:
          kinds:
          - kind: enum
            size: 1
            values:
              '0x41':
                value: 'true'
                label:
                  en: Fault occurred.
                  ja: 異常あり
              '0x42':
                value: 'false'
                label:
                  en: No fault has occurred.
                  ja: 異常なし
        prometheus:
          export: enum_map
          enum_map:
            values:
              '0x41': 1
              '0x42': 0
      '0x89':
        name:
          en: Fault description
          ja: 異常内容
        short_name: faultDescription
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: enum
            size: 2
            values:
              '0x0000':
                value: noFault
                label:
                  en: No fault
                  ja: 異常なし
              '0x0001':
                value: trunOffOrUnplug
                label:
                  en: Faults that can be recovered from by turn off the power or unplug
                    and reoperate.
                  ja: スイッチを切る/コンセントを抜き再操作
              '0x0002':
                value: resetButton
                label:
                  en: Faults that can be recovered from by pressing the reset button.
                  ja: リセットボタンを押し再操作
              '0x0003':
                value: setIncorrectly
                label:
                  en: Device set incorrectly
                  ja: セット不良
              '0x0004':
                value: supply
                label:
                  en: Supply
                  ja: 補給
              '0x0005':
                value: cleaning
                label:
                  en: Cleaning (filters, etc.)
                  ja: 掃除（フィルタ等）
              '0x0006':
                value: changingBattery
                label:
                  en: Changing the battery
                  ja: 電池交換
              '0x0007':
                value: recoverOperationNoRequired
                label:
                  en: Recover operation no required
                  ja: 復帰操作不要
              '0x0009':
                value: userDefinable1
                label:
                  en: User-definable domain 1
                  ja: ユーザ定義領域1
              '0x03E9':
                value: repairLocationUnkown
                label:
                  en: Repair location unknown
                  ja: 修理箇所不明
              '0x03FF':
                value: fault
                label:
                  en: Fault
                  ja: 異常あり
      '0x8A':
        name:
          en: Manufacturer code
          ja: 会員ID/メーカコード
        short_name: manufacturer
        access:
          get: required
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: raw
      '0x8B':
        name:
          en: Business facility code
          ja: 事業場コード
        short_name: businessFacilityCode
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: raw
      '0x8C':
        name:
          en: Product code
          ja: 商品コード
        short_name: productCode
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: text
            bytes: 12
            trim_right:
            - nul
            - space
      '0x8D':
        name:
          en: Production number
          ja: 製造番号
        short_name: serialNumber
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: text
            bytes: 12
            trim_right:
            - nul
            - space
      '0x8E':
        name:
          en: Production date
          ja: 製造年月日
        short_name: productionDate
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: date
            bytes: 4
      '0x8F':
        name:
          en: Power-saving operation setting
          ja: 節電動作設定
        short_name: powerSaving
        access:
          get: optional
          set: optional
          inf: optional
        codec:
          kinds:
          - kind: enum
            size: 1
            values:
              '0x41':
                value: 'true'
                label:
                  en: Power saving Operation
                  ja: 節電動作中
              '0x42':
                value: 'false'
                label:
                  en: Normal Operation
                  ja: 通常動作中
        prometheus:
          export: enum_map
          enum_map:
            values:
              '0x41': 1
              '0x42': 0
      '0x93':
        name:
          en: Remote control setting
          ja: 遠隔操作設定
        short_name: remoteControl
        access:
          get: optional
          set: optional
          inf: optional
        codec:
          kinds:
          - kind: enum
            size: 1
            values:
              '0x41':
                value: 'true'
                label:
                  en: Not through a public network
                  ja: 公衆回線未経由操作
              '0x42':
                value: 'false'
                label:
                  en: Through a public network
                  ja: 公衆回線経由操作
              '0x61':
                value: 'true'
                label:
                  en: Communication line is normal. (operation through a public network
                    is not possible.)
                  ja: 通信回線正常(公衆回線経由の操作不可)
              '0x62':
                value: 'false'
                label:
                  en: Communication line is normal. (operation through a public network
                    is possible.)
                  ja: 通信回線正常(公衆回線経由の操作可能)
        prometheus:
          export: enum_map
          enum_map:
            values:
              '0x41': 1
              '0x42': 0
              '0x61': 1
              '0x62': 0
      '0x97':
        name:
          en: Current time setting
          ja: 現在時刻設定
        short_name: DEL
        access:
          get: optional
          set: optional
          inf: optional
        codec:
          kinds:
          - kind: time
            bytes: 2
            maximum_hour: 23
      '0x98':
        name:
          en: Current date setting
          ja: 現在年月日設定
        short_name: currentDateAndTime
        access:
          get: optional
          set: optional
          inf: optional
        codec:
          kinds:
          - kind: date
            bytes: 4
      '0x99':
        name:
          en: Power limit setting
          ja: 電力制限設定
        short_name: powerLimit
        access:
          get: optional
          set: optional
          inf: optional
        codec:
          kinds:
          - kind: uint
            bytes: 2
            unit: W
            minimum: '0'
            maximum: '65533'
      '0x9A':
        name:
          en: Cumulative operating time
          ja: 積算運転時間
        short_name: hourMeter
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: raw
            mra_type: object
      '0x9D':
        name:
          en: Status change announcement property map
          ja: 状変アナウンスプロパティマップ
        short_name: DEL
        access:
          get: required
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: property_map
      '0x9E':
        name:
          en: Set property map
          ja: Setプロパティマップ
        short_name: DEL
        access:
          get: required
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: property_map
      '0x9F':
        name:
          en: Get property map
          ja: Getプロパティマップ
        short_name: DEL
        access:
          get: required
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: property_map
  '0x0002':
    name:
      en: Crime prevention sensor
      ja: 防犯センサ
    short_name: crimePreventionSensor
    extends:
    - '0x0000'
    properties:
      '0xB0':
        name:
          en: Detection threshold level
          ja: 検知閾値レベル設定
        short_name: thresholdLevel
        access:
          get: optional
          set: optional
          inf: optional
        codec:
          kinds:
          - kind: raw
            mra_type: level
      '0xB1':
        name:
          en: Invasion occurrence status
          ja: 侵入発生状態
        short_name: detection
        access:
          get: required
          set: notApplicable
          inf: required
        codec:
          kinds:
          - kind: enum
            size: 1
            values:
              '0x41':
                value: 'true'
                label:
                  en: Detected
                  ja: 検知有
              '0x42':
                value: 'false'
                label:
                  en: Not detected
                  ja: 検知無
        prometheus:
          export: enum_map
          enum_map:
            values:
              '0x41': 1
              '0x42': 0
      '0xBF':
        name:
          en: Invasion occurrence status resetting
          ja: 侵入発生状態リセット設定
        short_name: reset
        access:
          get: notApplicable
          set: optional
          inf: notApplicable
        codec:
          kinds:
          - kind: enum
            size: 1
            values:
              '0x00':
                value: reset
                label:
                  en: Reset
                  ja: リセット
        prometheus:
          export: raw_uint
          raw_uint:
            bytes: 1
  '0x0003':
    name:
      en: Emergency button
      ja: 非常ボタン
    short_name: emergencyButton
    extends:
    - '0x0000'
    properties:
      '0xB1':
        name:
          en: Emergency occurrence status
          ja: 非常発生状態
        short_name: occurrenceOfEmergency
        access:
          get: required
          set: notApplicable
          inf: required
        codec:
          kinds:
          - kind: enum
            size: 1
            values:
              '0x41':
                value: 'true'
                label:
                  en: 'YES'
                  ja: 有
              '0x42':
                value: 'false'
                label:
                  en: 'NO'
                  ja: 無
        prometheus:
          export: enum_map
          enum_map:
            values:
              '0x41': 1
              '0x42': 0
      '0xBF':
        name:
          en: Emergency occurrence status resetting
          ja: 非常発生状態リセット設定
        short_name: reset
        access:
          get: notApplicable
          set: optional
          inf: notApplicable
        codec:
          kinds:
          - kind: enum
            size: 1
            values:
              '0x00':
                value: reset
                label:
                  en: Reset
                  ja: リセット
        prometheus:
          export: raw_uint
          raw_uint:
            bytes: 1
  '0x0007':
    name:
      en: Human detection sensor
      ja: 人体検知センサ
    short_name: humanDetectionSensor
    extends:
    - '0x0000'
    properties:
      '0xB0':
        name:
          en: Detection threshold level
          ja: 検知閾値レベル設定
        short_name: thresholdLevel
        access:
          get: optional
          set: optional
          inf: optional
        codec:
          kinds:
          - kind: raw
            mra_type: level
      '0xB1':
        name:
          en: Human detection status
          ja: 人体検知状態
        short_name: detection
        access:
          get: required
          set: notApplicable
          inf: required
        codec:
          kinds:
          - kind: enum
            size: 1
            values:
              '0x41':
                value: 'true'
                label:
                  en: Detected
                  ja: 検知有
              '0x42':
                value: 'false'
                label:
                  en: Not detected
                  ja: 検知無
        prometheus:
          export: enum_map
          enum_map:
            values:
              '0x41': 1
              '0x42': 0
  '0x000D':
    name:
      en: Illuminance sensor
      ja: 照度センサ
    short_name: illuminanceSensor
    extends:
    - '0x0000'
    properties:
      '0xE0':
        name:
          en: Measured illuminance value 1
          ja: 照度計測値1
        short_name: valueInLux
        access:
          get: required_c
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: uint
            bytes: 2
            unit: lux
            minimum: '0'
            maximum: '65533'
      '0xE1':
        name:
          en: Measured illuminance value 2
          ja: 照度計測値2
        short_name: valueInKlux
        access:
          get: required_c
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: uint
            bytes: 2
            unit: klux
            minimum: '0'
            maximum: '65533'
  '0x0011':
    name:
      en: Temperature sensor
      ja: 温度センサ
    short_name: temperatureSensor
    extends:
    - '0x0000'
    properties:
      '0xE0':
        name:
          en: Measured temperature value
          ja: 温度計測値
        short_name: value
        access:
          get: required
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: int
            bytes: 2
            scale: '0.1'
            unit: Celsius
            minimum: '-2732'
            maximum: '32766'
  '0x0012':
    name:
      en: Humidity sensor
      ja: 湿度センサ
    short_name: humiditySensor
    extends:
    - '0x0000'
    properties:
      '0xE0':
        name:
          en: Measured value of relative humidity
          ja: 相対湿度計測値
        short_name: value
        access:
          get: required
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: uint
            bytes: 1
            unit: '%'
            minimum: '0'
            maximum: '100'
  '0x0016':
    name:
      en: Bath heating status sensor
      ja: 風呂沸き上がりセンサ
    short_name: bathHeatingStatusSensor
    extends:
    - '0x0000'
    properties:
      '0xB0':
        name:
          en: Detection threshold level
          ja: 検知閾値レベル設定
        short_name: thresholdLevel
        access:
          get: optional
          set: optional
          inf: optional
        codec:
          kinds:
          - kind: raw
            mra_type: level
      '0xB1':
        name:
          en: Bath heating detection status
          ja: 風呂沸き上がり検知状態
        short_name: detection
        access:
          get: required
          set: notApplicable
          inf: required
        codec:
          kinds:
          - kind: enum
            size: 1
            values:
              '0x41':
                value: 'true'
                label:
                  en: Detected
                  ja: 検知有
              '0x42':
                value: 'false'
                label:
                  en: Not detected
                  ja: 検知無
        prometheus:
          export: enum_map
          enum_map:
            values:
              '0x41': 1
              '0x42': 0
  '0x001B':
    name:
      en: CO2 sensor
      ja: CO2センサ
    short_name: co2Sensor
    extends:
    - '0x0000'
    properties:
      '0xE0':
        name:
          en: Measured value of CO2 concentration
          ja: CO2濃度計測値
        short_name: value
        access:
          get: required
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: uint
            bytes: 2
            unit: ppm
            minimum: '0'
            maximum: '65533'
  '0x001D':
    name:
      en: VOC sensor
      ja: VOCセンサ
    short_name: vocSensor
    extends:
    - '0x0000'
    properties:
      '0xB0':
        name:
          en: Detection threshold level
          ja: 検知閾値レベル設定
        short_name: thresholdLevel
        access:
          get: optional
          set: optional
          inf: optional
        codec:
          kinds:
          - kind: raw
            mra_type: level
      '0xB1':
        name:
          en: VOC detection status
          ja: VOC 検知状態
        short_name: detection
        access:
          get: optional
          set: notApplicable
          inf: required
        codec:
          kinds:
          - kind: enum
            size: 1
            values:
              '0x41':
                value: 'true'
                label:
                  en: Detected
                  ja: 検知有
              '0x42':
                value: 'false'
                label:
                  en: Not detected
                  ja: 検知無
        prometheus:
          export: enum_map
          enum_map:
            values:
              '0x41': 1
              '0x42': 0
      '0xE0':
        name:
          en: Measured value of VOC concentration
          ja: VOC 濃度計測値
        short_name: value
        access:
          get: required
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: uint
            bytes: 2
            unit: ppm
            minimum: '0'
            maximum: '65533'
  '0x0022':
    name:
      en: Electric energy sensor
      ja: 電力量センサ
    short_name: electricEnergySensor
    extends:
    - '0x0000'
    properties:
      '0xE0':
        name:
          en: Cumulative amounts of electric energy
          ja: 積算電力量計測値
        short_name: cumulativeElectricEnergy
        access:
          get: required
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: uint
            bytes: 4
            scale: '0.001'
            unit: kWh
            minimum: '0'
            maximum: '999999999'
      '0xE1':
        name:
          en: Medium-capacity sensor instantaneous electric energy
          ja: 中容量センサ瞬時電力値計測値
        short_name: mediumCapacitySensorValue
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: int
            bytes: 4
            unit: W
            minimum: '-999999999'
            maximum: '999999999'
      '0xE2':
        name:
          en: Small-capacity sensor instantaneous electric energy
          ja: 小容量センサ瞬時電力値計測値
        short_name: smallCapacitySensorValue
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: int
            bytes: 2
            scale: '0.1'
            unit: W
            minimum: '-32767'
            maximum: '32766'
      '0xE3':
        name:
          en: Large-capacity sensor instantaneous electric energy
          ja: 大容量センサ瞬時電力値計測値
        short_name: largeCapacitySensorValue
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: int
            bytes: 2
            scale: '0.1'
            unit: kW
            minimum: '-32767'
            maximum: '32766'
      '0xE4':
        name:
          en: Cumulative amounts of electric energy measurement log
          ja: 積算電力量計測履歴情報
        short_name: log
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: array
            itemSize: 4
            items:
              kinds:
              - kind: uint
                bytes: 4
                scale: '0.001'
                unit: kWh
                minimum: '0'
                maximum: '999999999'
              - kind: enum
                size: 4
                values:
                  '0xFFFFFFFE':
                    value: noData
                    label:
                      en: Not measured
                      ja: 未計測
            minItems: 48
            maxItems: 48
      '0xE5':
        name:
          en: Effective voltage value
          ja: 実効電圧値計測値
        short_name: effectiveVoltageValue
        access:
          get: optional
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: uint
            bytes: 2
            unit: V
            minimum: '0'
            maximum: '65533'
  '0x0023':
    name:
      en: Current sensor
      ja: 電流センサ
    short_name: currentSensor
    extends:
    - '0x0000'
    properties:
      '0xE0':
        name:
          en: Measured current value 1
          ja: 電流値計測値1
        short_name: unsignedValue
        access:
          get: required_c
          set: notApplicable
          inf: optional
        codec:
          kinds:
          - kind: uint
            bytes: 4
            unit: mA
            minimum: '0'
            maximum: '4294967293'
      '0xE1':
        name:
          en: Rated voltage to be measured
          ja: 計測対象定格電圧値
        short_name: ratedVoltage
        access:
          get: optional
          set: notApplicable
