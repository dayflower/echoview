[project]
name = "echoview"
version = "0.1.0"
description = "ECHONET Lite discovery tools and generated catalog data"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
src = ["tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tools/test_*.py" = ["E402"]
